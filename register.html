<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Register</title>
    <style>
        *{
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            background-image: url("pictures/pexels-photo-325185.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form{
            width: 450px; margin: 100px auto;
            text-align: center;
            background-color: white;
            border-radius: 20px;
            padding: 50px;
            align-items: center;
        }

        button{
            width: 170px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px;
        }
        p a:hover{
            color: red;
        }
        
        .form-register {
            width: 350px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #aaa;
            margin-bottom: 35px;
            height: 45px;
        }

        .input-box input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
        }

        .input-box i {
            color: #999;
        }

        .input-box:focus-within {
            border-color: #1677ff;
        }
        .input-password:focus-within {
            border-color: red;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <form action="" style="
            ">


            <h1></h1>
            <i class="fa-solid fa-circle-user fa-2xl" style="color: rgb(0, 0, 0);"></i>
            <h3>Create Account</h3>
            <div class="input-box">
                <input type="text" placeholder="Full Name">
                <i class="fa-regular fa-user" style="color: #999999;"></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Username">
                <i class="fa-regular fa-user" style="color: #999999;"></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Email">
               <i class="fa-regular fa-envelope" style="color: #999999;"></i>
            </div>

            <div class="input-box input-password">
                <input type="password" placeholder="Password">
               <i class="fa-regular fa-eye" style="color: #999999;"></i>
            </div>

            <div class="input-box input-password">
                <input type="password" placeholder="Confirm Password">
               <i class="fa-regular fa-eye" style="color: #999999;"></i>
            </div>

            <button
            style="
            "           
            >Register</button>
            <p>Đã có tài khoản <a style="text-decoration: none; color: aquamarine;" href="login.html">Login</a></p>
        </form>
    </div>
</body>
</html>
