<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        *{
            box-sizing: border-box;
            
        }
        body{
            min-height: 100vh;
            background-image: url("pictures/pexels-photo-325185.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form{
            width: 450px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgb(203, 247, 247);
            margin: 300px auto;
            background-color: white;
            padding: 50px;
            text-align: center;
            align-items: center;
        }
        .form-login{
            width: 400px;
        }
        /* input{
            width: 200px;
            height: 30px;
            border-bottom: 1px solid #ccc;
        } */
        button{
            height: 30px;
            border-radius: 20px;
            width: 170px;
            background-color: black;
            color: white;
            border: none;
        }
        .input-box{
            display: flex;
            align-items: center;
            border-bottom: 1px solid #aaa;
            margin-bottom: 35px;
            height: 45px;
        }

        .input-box input {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            padding: 10px 0;
        }
        .input-box input::placeholder{
            color: #999;
        }
        .input-box span {
            width: 25px;
            text-align: center;
            cursor: pointer;
        }

        .input-box img {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }
    </Style>
</head>
<body>
    <form class="form-login">
        <h1>NDT</h1>
        <div class="input-box">
            <input type="text" name="username" placeholder="Username">
            <span>
                <img src="pictures/person_24px_outlined.svg" alt="">
            </span>
        </div>
        <div class="input-box">
            <input type="password" name="password" placeholder="Password">
            <span>
                <img src="pictures/eye-outline-512px.png" alt="">
            </span>
        </div>
        <button>Login</button>

    </form>
</body>
</html>
