<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <Style>
        *{
            box-sizing: border-box;
            
        }
        body{
            background-image: url(https://images.pexels.com/photos/325185/pexels-photo-325185.jpeg);
            background-repeat: no-repeat;
            background-size: cover;
        }
        form{
            width: 300px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgb(203, 247, 247);
            margin: 300px auto;
            background-color: white;
            padding: 30px;
            text-align: center;
            align-items: center;
        }
        .form-login{
            width: 300px;
        }
        input{
            width: 200px;
            height: 30px;
            border-bottom: 1px solid #ccc;
        }
        button{
            height: 30px;
            border-radius: 20px;
            width: 170px;
            background-color: black;
            color: white;
            border: none;
        }
        .input-box{
            display: flex;
            align-items: center;
            border-bottom: 1px solid #aaa;
            margin-bottom: 35px;
            height: 45px;
        }

        .input-box input {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            padding: 10px 0;
        }
        .input-box input::placeholder{
            color: #999;
        }
    </Style>
</head>
<body>
    <form class="form-login">
        <h1>NDT</h1>
        <div class="input-box">
            <input type="text" name="username" placeholder="Username">
        </div>
        <div class="input-box">
            <input type="password" name="password" placeholder="Password">
        </div>
        <button>Login</button>

    </form>
</body>
</html>
